# ═══════════════════════════════════════════════════════════════
# Nginx ISS — VPS MUTUALISÉ, HTTP SEULEMENT (temporaire, sans TLS)
#
# L'ISS partage le VPS avec d'autres instances : le port 80 est pris par
# `asleyn`, 8080 par `siga` (le privé), 9090 par `ipgei`. L'ISS écoute donc sur
# le port conteneur 80, publié sur l'hôte via SIGA_WEB_PORT → http://<IP>:7080
#
# .env :  SIGA_NGINX_CONF=./nginx.vps-http.conf
#         SIGA_WEB_PORT=7080  SIGA_WEB_PORT_INTERNAL=80
#         DJANGO_COOKIE_SECURE=False
#
# ⚠️ HTTP = login et données EN CLAIR sur Internet. Les cookies JWT ne peuvent
#    pas être `Secure` ici : marqués Secure, le navigateur ne les renverrait
#    jamais sur http:// et la connexion serait impossible. C'est le même
#    compromis que l'instance du privé, à lever dès qu'un certificat est en
#    place (nginx.vps.conf + Let's Encrypt).
#
# `$http_host` porte le PORT (208.85.19.82:7080) : le sub_filter réécrit donc
# le placeholder du frontend vers la bonne origine, port compris.
# ═══════════════════════════════════════════════════════════════

# keepalive : nginx garde des connexions ouvertes vers gunicorn au lieu d'en
# rouvrir une par requête (proxy_http_version 1.1 + Connection "" dans /api/).
upstream backend_upstream  { server backend:8000; keepalive 16; }
upstream frontend_upstream { server frontend:3000; }

server_tokens off;

# Compression : notes, emploi du temps, notifications (JSON) 3 à 5 fois plus
# légers sur le réseau mobile. Les PDF et images, déjà compressés, sont exclus.
gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json text/plain text/css application/javascript text/javascript image/svg+xml;

# Autorisation des fichiers /media/ (photos, pièces) : Django répond 204 si
# l'appelant est connecté, sans regarder le fichier. Ce « oui » est gardé
# 5 min PAR JETON DE SESSION (cookie access_token) : une liste de 40 photos
# ne coûte plus 40 passages par Django. Sans jeton : jamais gardé ; un refus
# (401/403) : jamais gardé.
proxy_cache_path /var/cache/nginx/media_auth levels=1:2 keys_zone=media_auth:1m max_size=10m inactive=10m use_temp_path=off;
map $cookie_access_token $media_auth_sans_jeton { "" 1; default 0; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── API Django ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── Admin Django ───────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Statics Django ─────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Assets PUBLICS institution (logo/sceau/favicon) — sans auth ─
    location ^~ /media/institutions/logos/ {
        root /var/www; add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600"; access_log off;
    }
    location ^~ /media/institutions/sceaux/ {
        root /var/www; add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600"; access_log off;
    }
    location ^~ /media/institutions/favicons/ {
        root /var/www; add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600"; access_log off;
    }

    # ─── Media privé (protégé par auth_request vers Django) ─────
    location /media/ {
        auth_request /internal/media-auth/;
        alias /var/www/media/;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /internal/media-auth/ {
        internal;
        proxy_pass http://backend_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_cache           media_auth;
        proxy_cache_key       $cookie_access_token;
        proxy_cache_valid     204 5m;
        proxy_cache_bypass    $media_auth_sans_jeton;
        proxy_no_cache        $media_auth_sans_jeton;
        proxy_ignore_headers  Cache-Control Expires Set-Cookie Vary;
    }

    # ─── Frontend Next.js ───────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        # Réécrit le placeholder buildé -> même origine (http://<IP>:<port>)
        sub_filter 'http://__SIGA_API_HOST__' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
